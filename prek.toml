#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "oxlint", name = "oxlint (staged)", entry = "node_modules/.bin/oxlint", language = "system", types_or = [
    "ts",
    "tsx",
  ] },
  { id = "oxfmt", name = "oxfmt --check (staged)", entry = "node_modules/.bin/oxfmt --check", language = "system", types_or = [
    "ts",
    "tsx",
  ] },
  { id = "typecheck", name = "typecheck", entry = "bun run typecheck", language = "system", stages = [
    "manual",
  ], pass_filenames = false },
]
